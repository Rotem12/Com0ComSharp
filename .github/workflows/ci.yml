name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Com0ComSharp.sln
      - run: dotnet build Com0ComSharp.sln -c Release --no-restore
      - run: dotnet test tests/Com0ComSharp.Tests -c Release --no-build
      - name: Verify x86 Framework callers
        shell: pwsh
        run: |
          foreach ($framework in @('net462', 'net48')) {
            dotnet test tests/Com0ComSharp.Tests -c Release -f $framework --no-build -- RunConfiguration.TargetPlatform=x86
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: dotnet pack src/Com0ComSharp -c Release --no-build -o .artifacts/packages
      - name: Verify packaged library in C# 7.3 Framework consumers
        shell: pwsh
        run: |
          dotnet restore samples/Com0ComSharp.Framework -p:UsePackagedLibrary=true --configfile scripts/FrameworkConsumer.NuGet.config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build samples/Com0ComSharp.Framework -c Release --no-restore -p:UsePackagedLibrary=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($framework in @('net462', 'net472', 'net48', 'net481')) {
            & "samples/Com0ComSharp.Framework/bin/Release/$framework/Com0ComSharp.Framework.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: dotnet publish src/Com0ComSharp.Tool -f net8.0-windows -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .artifacts/tool
      - run: dotnet publish src/Com0ComSharp.Tool -f net48 -c Release -o .artifacts/tool-net48
      - run: dotnet publish src/Com0ComSharp.Broker -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .artifacts/broker
      - name: Verify and archive Framework helper
        shell: pwsh
        run: |
          & .artifacts/tool-net48/Com0ComSharp.Tool.exe diagnose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item LICENSE .artifacts/tool-net48/
          Compress-Archive -Path .artifacts/tool-net48/* -DestinationPath .artifacts/Com0ComSharp.Tool.net48.zip -Force
      - name: Bundle matching helpers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .artifacts/helpers -Force | Out-Null
          Copy-Item .artifacts/tool/Com0ComSharp.Tool.exe .artifacts/helpers/
          Copy-Item .artifacts/broker/Com0ComSharp.Broker.exe .artifacts/helpers/
          Copy-Item LICENSE .artifacts/helpers/
          $taskRuntime = (Get-Content src/Com0ComSharp.Broker/bin/Release/net8.0-windows/win-x64/Com0ComSharp.Broker.runtimeconfig.json -Raw | ConvertFrom-Json).runtimeOptions.includedFrameworks[0].version
          $taskCache = (dotnet nuget locals global-packages --list) -replace '^global-packages:\s*', ''
          $taskRuntimePackage = Join-Path $taskCache "microsoft.netcore.app.runtime.win-x64/$taskRuntime"
          New-Item -ItemType Directory -Path .artifacts/helpers/licenses -Force | Out-Null
          Copy-Item "$taskRuntimePackage/LICENSE.TXT", "$taskRuntimePackage/THIRD-PARTY-NOTICES.TXT" .artifacts/helpers/licenses/
          Compress-Archive -Path .artifacts/helpers/* -DestinationPath .artifacts/Com0ComSharp.Helpers.win-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Com0ComSharp
          path: |
            .artifacts/packages/*.nupkg
            .artifacts/Com0ComSharp.Helpers.win-x64.zip
            .artifacts/Com0ComSharp.Tool.net48.zip
