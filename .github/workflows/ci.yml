name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore Com0ComSharp.sln
      - run: dotnet build Com0ComSharp.sln -c Release --no-restore
      - run: dotnet test tests/Com0ComSharp.Tests -c Release --no-build
      - run: dotnet pack src/Com0ComSharp -c Release --no-build -o .artifacts/packages
      - run: dotnet publish src/Com0ComSharp.Tool -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .artifacts/tool
      - uses: actions/upload-artifact@v4
        with:
          name: Com0ComSharp
          path: |
            .artifacts/packages/*.nupkg
            .artifacts/tool/Com0ComSharp.Tool.exe
